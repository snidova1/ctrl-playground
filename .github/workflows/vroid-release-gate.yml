name: VRoid Avatar Release Gate
on:
  pull_request:
    paths:
      - 'features/plaza/scene.tsx'
      - 'features/plaza/plaza-app.tsx'
      - 'features/plaza/characters/**'
      - 'features/habitat/stage.tsx'
      - 'tests/unit/vroid-live-default.test.ts'
      - 'docs/VRM_DEPLOYMENT_GATE.md'
      - '.github/workflows/vroid-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  avatar-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: VRoid default and no-Mio fallback regression tests
        run: pnpm exec vitest run tests/unit/vroid-live-default.test.ts tests/unit/vrm-character.test.ts
      - name: Scoped lint for avatar render paths
        run: pnpm exec eslint features/plaza/scene.tsx features/plaza/characters/vrm-avatar.tsx features/plaza/plaza-app.tsx
      - name: TypeScript integration
        run: pnpm exec tsc --noEmit --target ES2020
      - name: Next production build
        run: pnpm build:next
