name: Public World is an Actual Place
on:
  pull_request:
    branches:
      - feat/townies-gameplay-stylized-world
      - feat/public-world-garden-life
      - feat/public-world-real-neighborhood
      - feat/public-world-and-guest-play
      - work/master-integration
    paths:
      - 'features/habitat/public-world-geography.ts'
      - 'features/habitat/town-scenery.tsx'
      - 'features/habitat/town-*.ts*'
      - 'features/habitat/app.tsx'
      - 'features/habitat/habitat.css'
      - 'features/plaza/scene.tsx'
      - 'features/habitat/stage.tsx'
      - 'features/habitat/types.ts'
      - 'domain/habitat.ts'
      - 'domain/town*.ts'
      - 'server/habitat/town*.ts'
      - 'drizzle/*.sql'
      - 'server/habitat/service.ts'
      - 'tests/unit/public-world.test.ts'
      - 'tests/unit/town*.test.ts'
      - 'tests/browser/town-civic.spec.ts'
      - 'playwright.civic.config.ts'
      - 'playwright.town-life.config.ts'
      - 'tests/browser/town-routes-gatherings.spec.ts'
      - 'tests/browser/public-world-visual.spec.ts'
      - 'playwright.public-world.config.ts'
      - '.github/workflows/public-world-visual.yml'
  workflow_dispatch:
concurrency:
  group: ctrl-public-world-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  worker-build:
    name: Worker production compilation — no deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use example build configuration without deployment credentials
        run: cp .env.example .env.local
      - name: Compile portable Cloudflare Worker
        run: pnpm build
      - name: Verify the configured Worker entry exists
        run: test -f dist/server/wrangler.json
  public-world:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Public World API/geometry/bounds regression
        run: pnpm test
      - name: Strict project typecheck
        run: pnpm typecheck
      - name: Public World scoped lint
        run: pnpm exec eslint features/habitat/town-scenery.tsx features/habitat/public-world-geography.ts features/habitat/types.ts features/habitat/stage.tsx features/habitat/app.tsx features/habitat/town-camera.ts features/habitat/town-residents.ts features/habitat/town-guide.tsx features/plaza/scene.tsx domain/habitat.ts tests/browser/public-world-visual.spec.ts
      - name: Install headless Chromium with software WebGL
        run: pnpm exec playwright install --with-deps chromium
      - name: Production compilation only — no deploy
        run: pnpm build:next
      - name: Capture actual desktop and mobile world pixels using a signed wallet
        env:
          CTRL_QA_PRODUCTION: '1'
        run: pnpm exec playwright test --config playwright.public-world.config.ts
      - name: Two signed desktop/mobile neighbors complete persistent civic construction
        run: pnpm exec playwright test --config playwright.civic.config.ts --grep 'persistent waterfront'
      - name: Preserve screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctrl-real-town-screenshots
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
  town-life:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install headless Chromium with software WebGL
        run: pnpm exec playwright install --with-deps chromium
      - name: Production compilation only — no deploy
        run: pnpm build:next
      - name: Real route work, room persistence and consented social gathering
        run: pnpm exec playwright test --config playwright.town-life.config.ts
      - name: Real shared daily table from orchard, cafe and garden work
        run: pnpm exec playwright test --config playwright.civic.config.ts --grep 'neighborhood table' --output test-results/town-life/community-table
      - name: Preserve room and activity screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctrl-real-town-life-screenshots
          path: test-results/town-life/
          retention-days: 14
          if-no-files-found: warn
