name: Habitat asset API integration
on:
  pull_request:
    branches:
      - work/integration
    paths:
      - 'server/habitat/asset-resolver.ts'
      - 'server/habitat/service.ts'
      - 'tests/unit/habitat-asset-resolver.test.ts'
      - '.github/workflows/habitat-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: habitat-assets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare local database
        run: |
          cp .env.example .env.local
          pnpm db:local
      - name: Scoped backend lint
        run: pnpm exec eslint server/habitat/asset-resolver.ts server/habitat/service.ts tests/unit/habitat-asset-resolver.test.ts
      - name: Asset endpoint regression
        run: pnpm exec vitest run tests/unit/habitat-asset-resolver.test.ts
      - name: Existing unit and API tests
        run: pnpm test
      - name: TypeScript ES2020 (World Builder integration baseline)
        run: pnpm exec tsc --noEmit --target ES2020
      - name: Production Next build against pending ES2020 target
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const path='tsconfig.json'; const config=JSON.parse(fs.readFileSync(path,'utf8')); if (!['ES2017','ES2020'].includes(config.compilerOptions.target)) throw new Error('Unexpected TypeScript target'); config.compilerOptions.target='ES2020'; fs.writeFileSync(path,JSON.stringify(config,null,2)+'\\n');"
          pnpm build:next
