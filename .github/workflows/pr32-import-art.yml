name: PR32 verified CC0 anime scene assets
on:
  push:
    branches: [feat/pr32-anime-world-from-scratch]
    paths:
      - scripts/pr32-install-cc0-meshes.mjs
      - .github/workflows/pr32-import-art.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pr32-license-verified-asset-import
  cancel-in-progress: false
jobs:
  install-models:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.repository == 'snidova1/ctrl-playground'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/pr32-anime-world-from-scratch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Acquire, verify and stage Blender-origin CC0 meshes
        run: node scripts/pr32-install-cc0-meshes.mjs
      - name: Verify exactly eight nonempty binary GLBs
        run: |
          test "$(find public/assets/pr32 -name '*.glb' -type f | wc -l)" -eq 8
          test -s public/assets/pr32/manifest.json
      - name: Persist licensed meshes and origin manifest to PR32
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/pr32
          if git diff --cached --quiet; then
            echo 'No asset updates needed'
            exit 0
          fi
          git commit -m "assets(pr32): commit provenance-verified CC0 textured village GLBs"
          git push origin HEAD:feat/pr32-anime-world-from-scratch
