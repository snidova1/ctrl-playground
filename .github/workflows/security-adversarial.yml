name: Security adversarial regression
on:
  pull_request:
    branches: [main, work/master-integration]
    paths:
      - 'tests/unit/security/**'
      - '.github/workflows/security-adversarial.yml'
      - 'docs/security-adversarial-report.md'
      - 'server/**'
      - 'contracts/**'
      - 'features/habitat/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Run isolated adversarial regression suite
        run: pnpm exec vitest run tests/unit/security --config vitest.config.ts --reporter=verbose
      - name: Type-check with BigInt-compatible ES2020 target (existing repo target is ES2017)
        if: success() || failure()
        run: pnpm exec tsc --noEmit --target ES2020
