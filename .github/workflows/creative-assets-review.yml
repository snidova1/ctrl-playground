name: CTRL Creative Asset Review
on:
  pull_request:
    paths:
      - 'creative-assets/**'
      - 'tools/creative-assets/**'
      - 'docs/CREATIVE_ASSET_HANDOFF.md'
      - '.github/workflows/creative-assets-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate provenance and compatible templates
        run: node tools/creative-assets/validate.mjs
      - name: Regression tests
        run: node --test tools/creative-assets/validate.test.mjs
      - name: Test ready-to-save scene templates without server writes
        run: node --test tools/creative-assets/instantiate-preset.test.mjs
      - name: Reject unaudited binary assets
        run: |
          if git ls-files creative-assets tools/creative-assets | grep -Ei '\.(glb|gltf|fbx|vrm|vrma|blend|zip|png|jpg|webp|wav|mp3|ktx2)$'; then
            echo "Discovery PR must not ship unreviewed assets"
            exit 1
          fi
