name: Repair Empty CTRL Thumbnails

on:
  push:
    branches:
      - 'qa/asset-integrity-budget'
    paths:
      - 'scripts/qa/repair-empty-previews.py'
      - '.github/workflows/ctrl-repair-previews.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.ref == 'refs/heads/qa/asset-integrity-budget'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deterministic CPU renderer
        run: python -m pip install numpy==2.3.5 trimesh==4.11.1 pillow==12.3.0
      - name: Repair only the zero-byte files from matching GLBs
        run: |
          python scripts/qa/repair-empty-previews.py --report /tmp/ctrl-repaired.json
          python - <<'PY'
          import json
          from pathlib import Path
          repaired = json.loads(Path('/tmp/ctrl-repaired.json').read_text())
          assert len(repaired) == 14, f'Expected 14 known empty previews, got {len(repaired)}'
          assert all(50 <= row['bytes'] <= 16384 for row in repaired)
          PY
      - name: Run full catalog and binary integrity gate
        run: node scripts/qa/check-build-assets.mjs
      - name: Commit only repaired previews to QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- public/plaza/build-kit
          git diff --cached --quiet && { echo "No changed previews"; exit 1; }
          git diff --cached --name-only | tee /tmp/ctrl-changed-files.txt
          test "$(wc -l < /tmp/ctrl-changed-files.txt)" -eq 14
          grep -Ev '^public/plaza/build-kit/(furniture-kit|nature-kit)/thumbs/[^/]+[.]webp$' /tmp/ctrl-changed-files.txt && { echo "Unexpected modifications"; exit 1; } || true
          git commit -m "fix(assets): regenerate 14 empty Kenney model previews"
          git push origin HEAD:qa/asset-integrity-budget
