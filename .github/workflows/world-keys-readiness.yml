name: World Keys deploy readiness (offline)
on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/keys/**'
      - 'contracts/CTRLTestToken.sol'
      - 'scripts/testnet/world-keys-*.mjs'
      - 'scripts/testnet/check-world-keys.mjs'
      - 'scripts/testnet/check-world-keys-cli.mjs'
      - 'scripts/testnet/compile.mjs'
      - '.github/workflows/world-keys-readiness.yml'
      - 'docs/world-keys-testnet-handoff.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keys-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify dry-run CLI requires no secrets for help
        run: node scripts/testnet/world-keys-deploy.mjs --help
      - name: Execute World Keys solvency and adversarial scenarios on in-memory Ganache
        run: node scripts/testnet/check-world-keys.mjs
      - name: Exercise testnet CLI entirely against localhost Ganache fixture
        run: node scripts/testnet/check-world-keys-cli.mjs
      - name: TypeScript check with existing BigInt-compatible override
        run: pnpm exec tsc --noEmit --target ES2020
