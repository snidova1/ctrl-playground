name: CTRL Holder Gallery Review
on:
  pull_request:
    paths:
      - 'features/plaza/editor/**'
      - 'server/habitat/service.ts'
      - 'docs/holder-catalog-handoff.md'
      - 'docs/PREMIUM_ASSET_SOURCING.md'
      - 'creative-assets/premium-source-candidates.json'
      - 'tools/creative-assets/validate-premium-sources.mjs'
      - '.github/workflows/holder-gallery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify sourced model evidence and no fabricated paid inventory
        run: node tools/creative-assets/validate-premium-sources.mjs
      - name: Tier and ETH price/quality policy tests
        run: pnpm exec vitest run tests/unit/holder-gallery-tiers.test.ts tests/unit/holder-gallery-eth.test.ts
      - name: Scoped lint
        run: pnpm exec eslint features/plaza/editor/holder-tiers.ts features/plaza/editor/eth-exclusive.ts features/plaza/editor/habitat-tools.tsx
      - name: Typecheck ES2020
        run: pnpm exec tsc --noEmit --target ES2020
      - name: Next production build
        run: pnpm build:next
