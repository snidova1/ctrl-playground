services:
  ctrl-worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set the deployed CTRL origin}
      WORKER_SECRET: ${WORKER_SECRET:?Set the matching worker secret}
      SITE_ACCESS_TOKEN: ${SITE_ACCESS_TOKEN:-}
